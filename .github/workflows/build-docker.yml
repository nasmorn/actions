name: Build a plain Dockerfile and save an artifact


on:
  workflow_call:
    inputs:
      IMAGE_NAME:
        required: true
        type: string
      DOCKERFILE:
        type: string
        default: "Dockerfile"
      PLATFORM:
        type: string
        default: "linux/amd64"
      # Cache image layers in the GitHub Actions cache (scoped per image)
      LAYER_CACHE:
        type: boolean
        default: false

jobs:
  build-and-push:
    # arm64 images build natively on GitHub's hosted arm64 runner instead of under QEMU
    runs-on: ${{ inputs.PLATFORM == 'linux/arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Only a platform the runner can't build natively needs emulation
      - name: Set up QEMU
        if: inputs.PLATFORM != 'linux/amd64' && inputs.PLATFORM != 'linux/arm64'
        uses: docker/setup-qemu-action@v4

      # The layer cache needs the docker-container driver
      - name: Set up Docker Buildx
        if: inputs.LAYER_CACHE || (inputs.PLATFORM != 'linux/amd64' && inputs.PLATFORM != 'linux/arm64')
        uses: docker/setup-buildx-action@v4

      # Exposes the cache credentials to the docker buildx run step below
      - name: Expose GitHub Actions runtime for the layer cache
        if: inputs.LAYER_CACHE
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build, tag, and push to repository
        id: build
        env:
          IMAGE_NAME: ${{ inputs.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          LAYER_CACHE: ${{ inputs.LAYER_CACHE }}
        run: |
          CACHE_ARGS=""
          if [ "$LAYER_CACHE" = "true" ]; then
            CACHE_ARGS="--cache-from type=gha,scope=$IMAGE_NAME --cache-to type=gha,mode=max,scope=$IMAGE_NAME"
          fi
          docker buildx build -f ${{ inputs.DOCKERFILE }} $CACHE_ARGS --platform ${{ inputs.PLATFORM }} --load -t $IMAGE_NAME:$IMAGE_TAG .
          docker save --output /tmp/${IMAGE_NAME}.tar ${IMAGE_NAME}:${IMAGE_TAG}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.IMAGE_NAME }}-${{ github.sha  }}
          path: /tmp/${{ inputs.IMAGE_NAME }}.tar
          retention-days: 1

